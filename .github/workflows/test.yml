name: Contract and native lifecycle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake libclang-dev
      - run: npm ci
      - run: npm run check:version
      - run: npm test
      - run: npm run build
      # No weights or paid service required. The real-model test is an explicit local gate.
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib local_translation
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage,rpm
          - os: windows-2022
            bundles: nsis
          - os: macos-15
            bundles: dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf cmake libclang-dev
      - run: npm ci
      - run: npm run check:version
      - name: Build Linux bundles
        if: runner.os == 'Linux'
        run: npm run tauri:build
      - name: Build Windows or macOS bundle
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: npx --no-install tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: daneo-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
